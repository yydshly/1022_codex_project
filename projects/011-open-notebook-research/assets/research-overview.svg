<text x="1208" y="1017" class="small" fill="#334a44" >页码引用 + 结构化证据 JSON</text>
<text x="1208" y="1046" class="small" fill="#334a44" >图页 / Markdown / 离线 ZIP</text>
<text x="48" y="1108" class="small" fill="#397e8a" >归属说明：后两层是本轮研究整理；详细精读不是 APD / NotebookLM / MiniMax 自动产出的效果。</text>
<text x="48" y="1154" class="section" fill="#397e8a" >04</text>
<text x="97" y="1154" class="section" fill="#193d36" >实际效果：拿到了什么，质量到哪里</text>
