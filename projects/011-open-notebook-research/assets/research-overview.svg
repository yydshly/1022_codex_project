<text x="1086" y="1251" class="metric" fill="#193d36" >3 篇精读 + 1 篇综合</text>
<text x="1086" y="1288" class="small" fill="#334a44" >逐篇约 4,000–4,500 汉字</text>
<text x="1086" y="1315" class="small" fill="#334a44" >6 张图页 / 119 处 PDF 页码引用</text>
<text x="1086" y="1342" class="small" fill="#334a44" >效果：解释依据、发现矛盾、形成后续问题</text>
<rect x="48" y="1380" width="1504" height="68" rx="8" fill="#f5eedf" stroke="#e1d6bf" stroke-width="1.5"/>
<text x="68" y="1408" class="small" fill="#876234" >验证边界：未生成音频、视频、幻灯片或 embedding；原版云应用的用户入口未打通；当前网页仅阅读已保存结果。</text>
<text x="68" y="1435" class="small" fill="#876234" >详细精读核对主文与关键图表，未重算原始实验数据；3 篇样本不构成系统综述，也未量化提效或准确率。</text>
<text x="48" y="1480" class="small" fill="#6e8073" >依据：固定源码 + 本地实测证据 + 原论文精读  ｜  APD e1663ba · Open Notebook a0f6f30（镜像另记）</text>
