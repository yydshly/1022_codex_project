<text x="70" y="1251" class="metric" fill="#193d36" >916 → 30 → 3</text>
<text x="70" y="1288" class="small" fill="#334a44" >检索命中 → 保存候选 → 选取论文</text>
<text x="70" y="1315" class="small" fill="#334a44" >3 份原始 PDF / 51 页，哈希一致</text>
<text x="70" y="1342" class="small" fill="#334a44" >效果：获得可追溯的研究输入</text>
