<text x="578" y="1251" class="metric" fill="#193d36" >2 份完整短回答</text>
<text x="578" y="1288" class="small" fill="#334a44" >1,460 / 3,056 字符；另有 350 字截断</text>
<text x="578" y="1315" class="small" fill="#334a44" >能抽取关键条件；仍有译名与概括问题</text>
<text x="578" y="1342" class="small" fill="#334a44" >效果：可做初读草稿，需回原文核对</text>
<rect x="1064" y="1175" width="488" height="185" rx="10" fill="#fffef9" stroke="#d5ded0" stroke-width="1.5"/>
