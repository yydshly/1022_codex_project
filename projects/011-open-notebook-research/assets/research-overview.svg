<text x="828" y="1046" class="small" fill="#334a44" >3 份逐篇精读 + 1 份综合</text>
<rect x="1188" y="909" width="364" height="166" rx="10" fill="#fffef9" stroke="#d5ded0" stroke-width="1.5"/>
