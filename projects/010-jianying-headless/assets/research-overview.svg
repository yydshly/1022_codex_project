<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">我们的理解主线：复用剪映引擎，重建控制层</title>
<desc id="desc">自有界面、AI 和批处理作为入口。Skill 指导宿主 AI 规划与调用，jianying-headless 构建可编辑草稿并桥接本机剪映内部服务，剪映引擎负责原生处理和视频导出。REA 在侧边辅助内部接口分析和核心库适配，不参与剪辑执行。我们可以扩展产品入口、剪辑策略、草稿功能和版本支持；复用引擎仍依赖匹配的剪映安装，独立重建与完整功能覆盖尚未实现。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#a2cbb6" stroke-width="1.4"/></marker><marker id="research-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#b7c8dc" stroke-width="1.4"/></marker></defs>
<rect width="1280" height="800" fill="#142a35"/>
<g font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif">
<text x="48" y="40" fill="#9bd9c4" font-size="14" letter-spacing="3">OUR UNDERSTANDING / 010 / FIXED SOURCE STUDY</text>
<text x="48" y="95" fill="#eff6ee" font-size="40" font-weight="600">复用剪映引擎，重建我们的控制层。</text>
<text x="48" y="131" fill="#b5c9c1" font-size="18">逆向适配 → 复用引擎 → 重建控制层 → 按层扩展与验证</text>

<rect x="48" y="159" width="1184" height="78" fill="#1b3a36" stroke="#527f6d"/>
<text x="70" y="185" fill="#a5c9b6" font-size="12" letter-spacing="1">入口与产品层</text>
<text x="70" y="216" fill="#eef4ec" font-size="22">我们的界面 / AI 任务 / 批处理</text>
<rect x="777" y="182" width="101" height="29" fill="none" stroke="#75a087"/>
<text x="791" y="202" fill="#c4e9ce" font-size="14">可扩展 ①</text>
<text x="893" y="203" fill="#c4e9ce" font-size="16">自有界面 · 任务服务 · 多版本</text>
<path d="M 222 238 V 278" stroke="#a2cbb6" fill="none" marker-end="url(#arrow)"/>
<text x="243" y="263" fill="#9ebbb3" font-size="12">宿主 AI 按规则组织计划；程序也可直接调用核心库</text>

<rect x="48" y="288" width="348" height="228" fill="#1b353e" stroke="#4e6d72"/>
<text x="70" y="316" fill="#a2c5b4" font-size="13">01 / AI 编排层</text>
<text x="70" y="356" fill="#eff6ee" font-size="30" font-weight="600">Skill</text>
<text x="70" y="383" fill="#a9c4c1" font-size="17">yichen-jianying-edit</text>
<text x="70" y="418" fill="#c1d1cd" font-size="17">指导 AI 规划删留、字幕与调用；</text>
<text x="70" y="445" fill="#c1d1cd" font-size="17">辅助时间映射与结果验收。</text>
<path d="M 70 463 H 374" stroke="#426555"/>
<text x="70" y="494" fill="#c1e9cf" font-size="16">可扩展 ② · 剪辑策略与规则</text>

<path d="M 407 363 H 451" stroke="#a2cbb6" fill="none" marker-end="url(#arrow)"/>
<text x="429" y="393" fill="#a0b8b1" font-size="11" text-anchor="middle">计划</text><text x="429" y="411" fill="#a0b8b1" font-size="11" text-anchor="middle">命令</text>

<rect x="462" y="288" width="348" height="228" fill="#23443e" stroke="#8cb69c"/>
<text x="484" y="316" fill="#b5d7c0" font-size="13">02 / 草稿构建与桥接层</text>
<text x="484" y="356" fill="#eff6ee" font-size="30" font-weight="600">核心库</text>
<text x="484" y="383" fill="#b5d7c0" font-size="17">jianying-headless</text>
<text x="484" y="418" fill="#d0dfd4" font-size="17">构建轨道、素材与字幕等工程；</text>
<text x="484" y="445" fill="#d0dfd4" font-size="17">桥接编解码、恢复与导出服务。</text>
<path d="M 484 463 H 788" stroke="#648c75"/>
<text x="484" y="494" fill="#c1e9cf" font-size="16">可扩展 ③ · 草稿功能与版本适配</text>

<path d="M 821 363 H 865" stroke="#a2cbb6" fill="none" marker-end="url(#arrow)"/>
<text x="843" y="393" fill="#a0b8b1" font-size="11" text-anchor="middle">工程</text><text x="843" y="411" fill="#a0b8b1" font-size="11" text-anchor="middle">内部接口</text>

<rect x="876" y="288" width="356" height="228" fill="#2a3538" stroke="#a68160"/>
<text x="898" y="316" fill="#d8b99a" font-size="13">03 / 原生服务与渲染层</text>
<text x="898" y="356" fill="#eff6ee" font-size="30" font-weight="600">剪映底层引擎</text>
<text x="898" y="383" fill="#d8b99a" font-size="17">本机程序库 + 原生资源</text>
<text x="898" y="418" fill="#d0d7d2" font-size="17">提供原生编解码、工程恢复、</text>
<text x="898" y="445" fill="#d0d7d2" font-size="17">画面与音频处理、视频导出。</text>
<path d="M 898 463 H 1210" stroke="#715e4e"/>
<text x="898" y="494" fill="#e1c4a4" font-size="15">依赖已安装、已适配的剪映版本</text>

<path d="M 636 551 V 521" stroke="#b7c8dc" stroke-dasharray="4 4" fill="none" marker-end="url(#research-arrow)"/>
<text x="655" y="540" fill="#b0bfd1" font-size="11">辅助核心库适配</text>
<rect x="48" y="551" width="762" height="106" fill="#1e2e3b" stroke="#8b99ad" stroke-dasharray="5 4"/>
<text x="70" y="582" fill="#a8b9d1" font-size="12">研究辅助</text>
<text x="70" y="619" fill="#d5deed" font-size="28" font-weight="600">REA</text>
<text x="193" y="590" fill="#c2cddd" font-size="16">AI + 反编译工具 → 分析接口、数据结构与调用顺序</text>
<text x="193" y="622" fill="#a2b1c7" font-size="15">用于发现与适配；剪辑执行无需经过 REA。</text>
<text x="876" y="574" fill="#9dbeb2" font-size="12">已适配原生路径的产出</text>
<text x="876" y="605" fill="#e2e9da" font-size="17">核心库 → 可编辑草稿（可回剪映精修）</text>
<text x="876" y="637" fill="#e2e9da" font-size="17">原生引擎 → 导出视频</text>

<path d="M 48 681 H 1232" stroke="#3c565b"/>
<text x="48" y="715" fill="#9bd9c4" font-size="16">核心价值</text>
<text x="155" y="715" fill="#e0eadf" font-size="20">把已有编辑能力接入 AI 编排、批量生产与人工精修，复用原生处理能力。</text>
<text x="48" y="751" fill="#a4b8af" font-size="13">图示为已适配原生路线；复用仍依赖剪映。新增能力须逐项验证，完整功能覆盖与独立重建尚未实现。</text>
<text x="48" y="776" fill="#7f9b94" font-size="11">原创研究图解 · 固定源码研究日期 2026.10.22 · 剪映原生流程未在本机实测 · 对应版本、源码与八项扩展提案见研究网页</text>
</g>
</svg>
