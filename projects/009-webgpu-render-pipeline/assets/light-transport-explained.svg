<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">红墙旁的白球：从直接光到缓存复用</title>
  <desc id="desc">原创教学示意。太阳照亮红墙和白球，墙面的红色反弹光影响白球。表面采样借助 BVH 查找命中，静态表面存入 Lightmap，其他接收对象从空间探针取光，逐帧与实时通道合成。箭头表示光能关系，不是逐光子模拟，也不是引擎运行结果。</desc>
  <defs>
    <marker id="gold-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#efca8e" stroke-width="1.8"/></marker>
    <marker id="red-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#f39b91" stroke-width="1.8"/></marker>
    <marker id="green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#9de2c5" stroke-width="1.8"/></marker>
    <radialGradient id="ball" cx="70%" cy="25%" r="85%"><stop stop-color="#fff5dc"/><stop offset=".48" stop-color="#e7d8cb"/><stop offset=".78" stop-color="#c9a3a1"/><stop offset="1" stop-color="#798a85"/></radialGradient>
  </defs>
  <rect width="1440" height="860" rx="16" fill="#101b1c"/>
  <g font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif">
    <text x="48" y="47" fill="#9de2c5" font-size="17" letter-spacing="2">LIGHT TRANSPORT / 教学示意</text>
    <text x="48" y="95" fill="#edf1eb" font-size="34" font-weight="600">红墙旁的白球，为什么会带一点红？</text>
    <text x="48" y="132" fill="#a5b8b2" font-size="21">几何决定遮挡，材质决定反射；采样估计来光，缓存让结果可以复用。</text>
    <rect x="48" y="163" width="864" height="430" rx="12" fill="#162526" stroke="#324443"/>
    <path d="M94 462 646 399 866 517 287 562Z" fill="#263b36" stroke="#536a5c"/>
    <path d="M218 243 411 279 411 455 218 421Z" fill="#a35450" stroke="#f3a79b" stroke-width="2"/>
    <path d="M411 279 437 264 437 438 411 455" fill="#6f3f3f"/>
    <text x="251" y="357" fill="#ffe4d9" font-size="24">红墙</text>
    <ellipse cx="612" cy="486" rx="117" ry="24" fill="#0c1718" opacity=".8"/>
    <circle cx="591" cy="413" r="73" fill="url(#ball)" stroke="#ddd8c5"/>
    <text x="679" y="413" fill="#edf1eb" font-size="22">白球</text>
    <text x="676" y="443" fill="#f3aca2" font-size="18">靠墙一侧受红色来光影响</text>
    <circle cx="740" cy="224" r="29" fill="#efca8e"/>
    <g stroke="#efca8e" stroke-width="2"><path d="M740 181v-14M740 267v14M697 224h-14M783 224h14M710 194l-10-10M770 254l10 10M770 194l10-10M710 254l-10 10"/></g>
    <text x="787" y="230" fill="#efca8e" font-size="21">太阳</text>
    <path d="M699 239 365 294" fill="none" stroke="#efca8e" stroke-width="3" marker-end="url(#gold-arrow)"/>
    <path d="M724 264 631 351" fill="none" stroke="#efca8e" stroke-width="3" marker-end="url(#gold-arrow)"/>
    <text x="478" y="241" fill="#efca8e" font-size="20">① 直接光</text>
    <path d="M418 350Q475 321 526 390" fill="none" stroke="#f39b91" stroke-width="4" marker-end="url(#red-arrow)"/>
    <text x="435" y="314" fill="#f39b91" font-size="20">② 反弹光</text>
    <g fill="#9de2c5" stroke="#102320" stroke-width="2"><circle cx="235" cy="267" r="5"/><circle cx="273" cy="279" r="5"/><circle cx="311" cy="284" r="5"/><circle cx="350" cy="293" r="5"/><circle cx="389" cy="304" r="5"/><circle cx="235" cy="397" r="5"/><circle cx="274" cy="408" r="5"/><circle cx="312" cy="413" r="5"/><circle cx="350" cy="424" r="5"/><circle cx="389" cy="432" r="5"/></g>
    <g stroke="#9de2c5" stroke-width="1.5" stroke-dasharray="5 7" fill="#162526"><path d="M114 366 171 348 171 466 114 484ZM114 366l35-39 57-18v118l-35 39M149 327v118l-35 39M171 348l35-39M114 425l57-18 35-39M143 356v118"/><circle cx="114" cy="366" r="5"/><circle cx="171" cy="348" r="5"/><circle cx="114" cy="484" r="5"/><circle cx="171" cy="466" r="5"/><circle cx="149" cy="327" r="5"/><circle cx="206" cy="309" r="5"/><circle cx="206" cy="427" r="5"/></g>
    <text x="96" y="526" fill="#9de2c5" font-size="18">空间探针 / 测光站</text>
    <text x="335" y="553" fill="#a5b8b2" font-size="18">绿点：表面采样单元（Surfel），不是真实颗粒</text>
    <g fill="#edf1eb">
      <rect x="940" y="163" width="452" height="430" rx="12" fill="#162526" stroke="#324443"/>
      <text x="968" y="207" fill="#9de2c5" font-size="22">程序怎样估计“反弹光”？</text>
      <text x="968" y="257" font-size="21">从表面选一些方向</text><text x="968" y="288" fill="#a5b8b2" font-size="19">用有限采样估计入射光积分。</text>
      <path d="M984 307v30" stroke="#9de2c5" stroke-width="2" marker-end="url(#green-arrow)"/>
      <text x="968" y="371" font-size="21">BVH 帮忙快速找命中</text><text x="968" y="402" fill="#a5b8b2" font-size="19">先排除整组几何，再查细节。</text>
      <path d="M984 421v30" stroke="#9de2c5" stroke-width="2" marker-end="url(#green-arrow)"/>
      <text x="968" y="485" font-size="21">加权、迭代，写入缓存</text><text x="968" y="516" fill="#a5b8b2" font-size="19">不是每帧穷举所有光线路径。</text>
      <text x="968" y="563" fill="#dab988" font-size="18">箭头画能量关系，积分器从表面采样。</text>
    </g>
    <g>
      <rect x="48" y="620" width="404" height="147" rx="10" fill="#1b2d2d" stroke="#536e62"/>
      <text x="72" y="658" fill="#9de2c5" font-size="22">③ 保存到表面 / 空间</text>
      <text x="72" y="700" fill="#edf1eb" font-size="20">静态 UV 表面 → Lightmap</text>
      <text x="72" y="735" fill="#a5b8b2" font-size="20">其他接收对象 → 附近探针插值</text>
      <path d="M469 692h48" stroke="#9de2c5" stroke-width="3" marker-end="url(#green-arrow)"/>
      <rect x="538" y="620" width="404" height="147" rx="10" fill="#1b2d2d" stroke="#536e62"/>
      <text x="562" y="658" fill="#9de2c5" font-size="22">④ 每帧读取并合成</text>
      <text x="562" y="700" fill="#edf1eb" font-size="20">缓存的间接光 + 当前实时通道</text>
      <text x="562" y="735" fill="#a5b8b2" font-size="20">相机换位置 → 重新绘制当前视图</text>
      <rect x="968" y="620" width="424" height="147" rx="10" fill="#302e26" stroke="#75694f"/>
      <text x="992" y="658" fill="#efca8e" font-size="22">灯光 / 建筑改变怎么办？</text>
      <text x="992" y="700" fill="#edf1eb" font-size="20">检查旧间接光，必要时重新烘焙。</text>
      <text x="992" y="735" fill="#d2c1a5" font-size="19">实时探针 ≠ 整张 Lightmap 自动更新</text>
    </g>
    <text x="48" y="816" fill="#a5b8b2" font-size="18">图解：本研究原创 · 依据固定源码 ca576b6 · 配色与场景均为教学示意，非上游渲染截图</text>
  </g>
</svg>
