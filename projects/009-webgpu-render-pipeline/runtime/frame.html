<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101b1c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%239de2c5' d='m8 1 7 7-7 7-7-7z'/%3E%3C/svg%3E">
  <title>原库 WebGPU · 三维场景实时画面</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b1c;color:#e8eee7;font:14px/1.8 'Segoe UI','Microsoft YaHei',sans-serif}#app{position:fixed;inset:0}canvas{display:block;touch-action:none}canvas:focus-visible{outline:2px solid #9de2c5;outline-offset:-3px}.overlay{position:fixed;inset:0;display:grid;place-content:center;gap:12px;padding:32px;text-align:center;z-index:10;background:#101b1cf2}.overlay[hidden]{display:none}.overlay strong{font-size:23px;font-weight:500}.overlay p{color:#b6c8be;max-width:620px;margin:0}.overlay small{color:#8fa99b}#runtime-error{white-space:pre-wrap;overflow-wrap:anywhere;max-height:55vh;overflow:auto;text-align:left;letter-spacing:0}#runtime-error-panel{background:#251e1d}.frame-label{position:fixed;left:15px;bottom:12px;z-index:2;pointer-events:none;border:1px solid #53665b;background:#0d1b1bdc;padding:4px 9px;border-radius:4px;font-size:10px;color:#bdcfbf}.busy{color:#e5c48f}
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="frame-label" id="frame-label">真实 WebGPU · 正在启动</div>
  <div class="overlay" id="runtime-loading"><strong>准备真实三维画面</strong><p id="runtime-stage" role="status" aria-live="polite">检查 WebGPU</p><small>首次启动需要编译着色器和烘焙间接光，请保留本页。</small></div>
  <div class="overlay" id="runtime-error-panel" hidden><strong>此设备暂时没有启动成功</strong><p id="runtime-error" role="alert"></p><small>需要支持 WebGPU 及原库所需设备上限的浏览器。可返回展示页重试。</small></div>
  <script type="module" src="./.atlas/main.ts"></script>
</body>
</html>
