<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
<title id="title">Seijaku：住宅导览、三项目对比与新增研究方向</title><desc id="description">原创研究图解。操作输入驱动相机、环境、材质和网页内容。对比 Kage、Sublevel Studio 与已有住宅，优先沉淀四季联动、构造拆解、加载与绘制调度。</desc>
<rect width="1600" height="1000" fill="#f2f0e8"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#29392e">
<text x="76" y="78" font-size="17" letter-spacing="4" fill="#78816f">FIELD NOTES / 014 · 建筑空间研究</text><text x="71" y="187" font-family="Georgia,serif" font-size="100" letter-spacing="-5">Seijaku</text><text x="522" y="176" font-size="36">从住宅参观，到可复用的空间能力</text><text x="77" y="235" font-size="22" fill="#707867">原库体验 · 能力与原理 · 三项目对比 · 研究价值</text><path d="M76 273H1524" stroke="#c6cebd"/>
<text x="77" y="323" font-size="15" letter-spacing="2" fill="#925537">01 / 它怎样工作</text>
<g font-size="24"><rect x="76" y="350" width="250" height="133" fill="#e2e7d9"/><text x="102" y="400">滚动 / 点击 / 拖动</text><text x="102" y="443" font-size="17" fill="#6f7a63">参观、选房、观察</text><text x="348" y="424">→</text><rect x="390" y="350" width="250" height="133" fill="#e2e7d9"/><text x="416" y="400">应用状态</text><text x="416" y="443" font-size="17" fill="#6f7a63">路线、章节、季节</text><text x="661" y="424">→</text><rect x="704" y="350" width="364" height="133" fill="#e2e7d9"/><text x="730" y="400">相机 / 环境 / 材质 / 文字</text><text x="730" y="443" font-size="17" fill="#6f7a63">Three.js 与 DOM 同步</text><text x="1090" y="424">→</text><rect x="1132" y="350" width="392" height="133" fill="#2c4537"/><text x="1158" y="400" fill="#f2f0e8">连续空间体验</text><text x="1158" y="443" font-size="17" fill="#becab0">住宅、庭院、材料与构造</text></g>
<text x="77" y="541" font-size="15" letter-spacing="2" fill="#925537">02 / 哪些已经研究过</text><g><text x="77" y="593" font-family="Georgia,serif" font-size="31">Kage</text><text x="77" y="632" font-size="19" fill="#707867">滚动镜头、章节、程序场景、氛围</text><text x="580" y="593" font-family="Georgia,serif" font-size="31">Sublevel Studio</text><text x="580" y="632" font-size="19" fill="#707867">模式切换、可玩物件、实时纹理</text><text x="1110" y="593" font-size="22">我们的住宅扩展</text><text x="1110" y="632" font-size="19" fill="#707867">庭院入户、房间图、导览</text></g><path d="M76 668H1524" stroke="#c6cebd"/>
<text x="77" y="719" font-size="15" letter-spacing="2" fill="#925537">03 / SEIJAKU 值得新增沉淀的部分</text>
<g><rect x="76" y="751" width="453" height="141" fill="#e6e2d6"/><text x="100" y="795" font-size="25">四季环境联动</text><text x="100" y="835" font-size="17" fill="#707867">共享状态 → 植被、积雪、光照与阴影</text><text x="100" y="867" font-size="15" fill="#925537">最小实验：固定机位，对照四季</text><rect x="550" y="751" width="453" height="141" fill="#e6e2d6"/><text x="574" y="795" font-size="25">构造拆解与标注</text><text x="574" y="835" font-size="17" fill="#707867">构件位移 → 镜头 → 跟随说明</text><text x="574" y="867" font-size="15" fill="#925537">最小实验：一组构件，可拆可合</text><rect x="1024" y="751" width="500" height="141" fill="#e6e2d6"/><text x="1048" y="795" font-size="25">加载与绘制调度</text><text x="1048" y="835" font-size="17" fill="#707867">分批构建、资源预热、按变化绘制</text><text x="1048" y="867" font-size="15" fill="#925537">最小实验：测首屏、长任务与绘制次数</text></g>
<text x="77" y="949" font-size="15" fill="#7c8573">原创研究图解 · 非运行截图 · 新模块为研究建议，尚未提炼成通用 SDK</text><text x="1346" y="949" font-size="15" fill="#7c8573">2026.10.22</text></g></svg>
