name: Validate research catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check catalog, assets and README
        run: python scripts/project_catalog.py check
      - name: Test catalog tooling
        run: python -m unittest discover -s scripts/tests -v
