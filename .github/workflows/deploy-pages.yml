name: Deploy research demos

on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - 'scripts/build_site.py'
      - 'scripts/project_catalog.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate catalog and generated shader sources
        run: |
          python scripts/project_catalog.py check
          python projects/001-swiftui-shaders/scripts/build_gallery.py --check
          python projects/001-swiftui-shaders/scripts/build_native.py --check
      - name: Package offline demo and assemble numbered sites
        run: |
          python projects/001-swiftui-shaders/scripts/package_web.py
          python scripts/build_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
