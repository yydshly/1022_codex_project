name: Deploy research demos

on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - 'scripts/build_site.py'
      - 'scripts/project_catalog.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate Old Coder acceptance labs and evidence identities
        run: |
          node projects/013-old-coder/scripts/verify_labs.cjs --check
          python projects/013-old-coder/scripts/build_overview.py --check
          python projects/013-old-coder/scripts/verify_web.py
      - name: Build four pinned WebGPU scene demos
        run: |
          python projects/009-webgpu-render-pipeline/scripts/setup_runtime.py
          python projects/009-webgpu-render-pipeline/scripts/build_runtime.py
      - name: Validate catalog and generated shader sources
        run: |
          python scripts/project_catalog.py check
          python projects/001-swiftui-shaders/scripts/build_gallery.py --check
          python projects/001-swiftui-shaders/scripts/build_native.py --check
      - name: Verify Jianying research and offline preservation archive
        run: |
          python projects/010-jianying-headless/scripts/package_preservation.py --check
          python projects/010-jianying-headless/scripts/package_web.py --check
          python projects/010-jianying-headless/scripts/verify_web.py
          node --check projects/010-jianying-headless/web/app.js
          node --check projects/010-jianying-headless/web/data.js
      - name: Package and verify heytea-style research page
        run: |
          python projects/015-heytea-style/scripts/package_web.py
          python projects/015-heytea-style/scripts/verify_web.py
      - name: Package offline demo and assemble numbered sites
        run: |
          python projects/001-swiftui-shaders/scripts/package_web.py
          python projects/003-algorithmic-sublime-poster/scripts/package_web.py
          python projects/003-algorithmic-sublime-poster/scripts/package_web.py --check
          python projects/004-xxd-panel-106/scripts/package_web.py
          python projects/004-xxd-panel-106/scripts/package_web.py --check
          python projects/004-xxd-panel-106/scripts/verify_web.py
          python projects/005-scene-card-studio/scripts/package_web.py
          python projects/005-scene-card-studio/scripts/package_web.py --check
          python projects/005-scene-card-studio/scripts/verify_web.py
          python projects/007-dr-aria/scripts/package_web.py
          python projects/007-dr-aria/scripts/package_web.py --check
          python projects/009-webgpu-render-pipeline/scripts/package_web.py
          python projects/009-webgpu-render-pipeline/scripts/package_web.py --check
          python projects/009-webgpu-render-pipeline/scripts/verify_structure.py
          python projects/011-open-notebook-research/scripts/package_web.py
          python projects/011-open-notebook-research/scripts/package_web.py --check
          python projects/011-open-notebook-research/scripts/verify_web.py
          python projects/012-super-hermes/scripts/verify_web.py
          python projects/014-seijaku/scripts/package_web.py
          python projects/014-seijaku/scripts/package_web.py --check
          python projects/014-seijaku/scripts/verify_web.py
          python projects/016-verdant-forest/scripts/package_web.py
          python projects/016-verdant-forest/scripts/package_web.py --check
          python projects/017-sparkvsr/scripts/package_web.py
          python projects/017-sparkvsr/scripts/package_web.py --check
          node --check projects/017-sparkvsr/web/app.js
          python scripts/build_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
